# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.

RELOAD_HTTP=""

RELOAD_SERVER="
        location /probe {
            auth_pam \"reload probe realm\";
            auth_pam_service_name \"nginx-reload-probe\";
            return 200 'never reached without credentials';
        }"

# Without credentials the module refuses the request and nginx sends the
# realm back in WWW-Authenticate.  That string comes from this module's
# own configuration, so a reload that left the location without it would
# show up here -- a plain status code would not, since nginx answers 401
# for several reasons.
#
# No PAM service is installed and none is needed: the refusal happens
# before the module talks to PAM.  The credential path needs a service
# file and a user, which belongs in the test suite, not in a reload loop.
RELOAD_EXPECT='reload probe realm'

reload_probe() {
	curl -s -i --max-time 5 "http://127.0.0.1:$PORT/probe" |
		sed -n 's/.*WWW-Authenticate: *Basic realm="\([^"]*\)".*/\1/p' | head -1
}
